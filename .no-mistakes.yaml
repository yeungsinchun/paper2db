# Trusted default-branch config for no-mistakes.
# CI: .github/workflows/pipeline-release.yml (full ./pipeline build + release).

# Unit suite (seconds, no build needed; generated-bank checks skip until
# ./pipeline has built tests/reconstructed/ and tests/sections/). Run worktrees
# start without .venv, so bootstrap one. Honored only from the default-branch copy.
commands:
  test: 'test -x .venv/bin/python || python3 -m venv .venv; .venv/bin/pip install -q -r requirements.txt && .venv/bin/python -m unittest discover -s tests'
